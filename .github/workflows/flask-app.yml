name: flask-app image

on:
  push:
    branches: [main]
    paths: # only run when this project (or this pipeline) changes
      - "flask-app/**"
      - ".github/workflows/flask-app.yml"
  workflow_dispatch: # manual "Run workflow" button

permissions:
  id-token: write # allow this job to request the GitHub OIDC token
  contents: read  # checkout only

concurrency:
  group: flask-app-image
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-app
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/flask-app
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push (tag = short git SHA)
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "Pushed \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # Update the desired state in the kubernetes repo (GitOps "drawings") to the image just pushed.
  bump-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Mint 1-hour token for the kubernetes repo (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          repositories: kubernetes

      - name: Checkout kubernetes repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kubernetes
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump image tag (kustomize)
        working-directory: flask/aks
        run: |
          TAG="${GITHUB_SHA::7}"
          kustomize edit set image "${{ vars.ACR_NAME }}.azurecr.io/flask-app:$TAG"
          git diff

      - name: Commit and push as the app's bot user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          if git diff --quiet; then echo "Tag already set, nothing to commit"; exit 0; fi
          BOT_ID=$(gh api "/users/${BOT}" --jq .id)
          git config user.name  "$BOT"
          git config user.email "${BOT_ID}+${BOT}@users.noreply.github.com"
          git commit -am "chore(flask-aks): bump flask-app to ${GITHUB_SHA::7}" \
                     -m "Source: ${{ github.repository }}@${GITHUB_SHA}"
          git pull --rebase   # in case someone pushed to kubernetes/main meanwhile
          git push
          echo "Bumped kubernetes/flask/aks to \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
